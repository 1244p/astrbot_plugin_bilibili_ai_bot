name: 上游更新检查

# 为什么放在 GitHub 上而不是本机：fork 的意义是不用盯着原仓库，
# 上游一动就能收到通知。这个 workflow 只负责"发现并报告"，
# 不改代码——本地补丁改的正是评价校验，上游一旦自己动了那块，
# 自动合并会盖掉判断，得人看一眼再决定。

on:
  schedule:
    # 每周一 02:00 UTC = 北京时间 10:00
    - cron: "0 2 * * 1"
  workflow_dispatch:
  # 上游有新 push 时 GitHub 不会通知 fork，只能靠定时轮询；
  # push 触发留给自己改完代码顺手验证一次。

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: chenluQwQ/astrbot_plugin_bilibili_ai_bot
  UPSTREAM_BRANCH: main
  # 这三个文件是本地补丁的落脚点，上游一动就得人工判断补丁还成不成立
  WATCH_FILES: "core/video_evaluation.py core/proactive.py tests/test_video_evaluation.py"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取上游并比较
        id: cmp
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --quiet upstream "${UPSTREAM_BRANCH}"

          BASE=$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")
          NEW=$(git log --pretty=format:'- `%h` %s' "HEAD..upstream/${UPSTREAM_BRANCH}" || true)

          if [ -z "$NEW" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "上游无新提交（upstream/${UPSTREAM_BRANCH} = ${BASE}）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### 上游有新提交：upstream/${UPSTREAM_BRANCH} 现在在 \`${BASE}\`"
            echo ""
            echo "$NEW"
            echo ""
            echo "### 这些提交改了什么"
            echo ""
            echo '```'
            git diff --stat "HEAD...upstream/${UPSTREAM_BRANCH}"
            echo '```'
            echo ""
            echo "### 与本地补丁的关系"
            echo ""
          } > /tmp/report.md

          TOUCHED=0
          for f in $WATCH_FILES; do
            if ! git diff --quiet "HEAD...upstream/${UPSTREAM_BRANCH}" -- "$f"; then
              echo "- ⚠️ 上游改过 \`${f}\`，先看 diff 再决定本地补丁是否还成立" >> /tmp/report.md
              TOUCHED=1
            fi
          done

          if [ "$TOUCHED" = "0" ]; then
            echo "- ✅ 评价相关文件没被上游动过，可以直接 \`git rebase upstream/main\`" >> /tmp/report.md
          else
            echo "" >> /tmp/report.md
            echo "特别检查：\`core/video_evaluation.py\` 里 \`score_reason\` 是否还是 \`_text(..., 120, ...)\` 硬抛错，" >> /tmp/report.md
            echo "以及有没有为新字段再漏写提示词字数——那是同一个毛病换了个字段。" >> /tmp/report.md
          fi

          echo "" >> /tmp/report.md
          echo "后续步骤：" >> /tmp/report.md
          echo '```bash' >> /tmp/report.md
          echo "git rebase upstream/main && python -m pytest tests/ -q" >> /tmp/report.md
          echo '```' >> /tmp/report.md

          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "has_new=true" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "上游有新提交，已写入报告"

      - name: 开 issue 或补充到已有 issue
        if: steps.cmp.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search '上游更新 in:title' \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            {
              echo "又发现一批新提交（upstream/main = \`${{ steps.cmp.outputs.base }}\`）："
              echo ""
              cat /tmp/report.md
            } > /tmp/comment.md
            gh issue comment "$EXISTING" --body-file /tmp/comment.md
            echo "已补充到 issue #${EXISTING}"
          else
            gh issue create \
              --title "上游更新：${{ steps.cmp.outputs.base }}" \
              --body-file /tmp/report.md
          fi
